sample:
  description: External SPI-NOR flash test for ISP2454 test boards
  name: ISP SPI Flash
common:
  tags:
    - drivers
    - flash
    - spi
tests:
  sample.drivers.spi_flash.isp2454:
    integration_platforms:
      - isp2454_lx_tb_mx/nrf54l15/cpuapp
    platform_allow:
      - isp2454_lx_tb_mx/nrf54l15/cpuapp
      - isp2454_lx_tb_rn/nrf54l15/cpuapp
      - isp2454_lp_tb_mx/nrf54l15/cpuapp
      - isp2454_lp_tb_rn/nrf54l15/cpuapp
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Flash erase succeeded!"
        - "Data read matches data written. Good!!"
