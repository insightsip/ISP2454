# SPI-NOR flash test app for the ISP2454 test boards
# (AT25FF321A on *_rn boards, MX25R3235F on *_mx boards).

CONFIG_STDOUT_CONSOLE=y
CONFIG_FLASH=y

# Already enabled by the ISP2454 board defconfigs, repeated here so the
# sample states everything it depends on.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y

# The ext_flash devicetree node carries an explicit sfdp-bfp property
# (see boards/insightsip/isp2454/isp2454_flash_{mx,rn}.dtsi) - read SFDP from
# devicetree rather than querying the chip at runtime.
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
