# This sample uses Kconfig.defaults to set options common for all
# samples. This file should contain only options specific for this sample
# or overrides of default values.

# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="ISP Matter Door Lock"

# Configure ZAP file name
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/lock.zap"

# 32774 == 0x8006 (example lock-app)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32774
CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# Enable DFU over Bluetooth LE (SMP). Off by default in Matter samples -
# without it, Button 1's short press (OTA update trigger) has nothing to
# advertise, and DFU tools like nRF Connect for Mobile have no SMP service
# to find on the device at all.
CONFIG_CHIP_DFU_OVER_BT_SMP=y
# Add support for LEDs and buttons on Nordic development kits
CONFIG_DK_LIBRARY=y

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="ISP_MatterLock"

# CONFIG_CHIP_DFU_OVER_BT_SMP enables CONFIG_BT_DEVICE_NAME_DYNAMIC (mcumgr
# can rename the device at runtime), which in turn makes Zephyr's BT host
# enforce CONFIG_BT_DEVICE_NAME_MAX > strlen(CONFIG_BT_DEVICE_NAME) at build
# time. The default computed for that buffer (15) was one byte too small
# for "ISP_Matter_Light" (16 chars) - this failed with
# "BUILD_ASSERT(DEVICE_NAME_LEN < CONFIG_BT_DEVICE_NAME_MAX)" in hci_core.c
# until sized explicitly here, with headroom for a longer name later.
CONFIG_BT_DEVICE_NAME_MAX=32

# Suspend devices when the CPU goes into sleep
CONFIG_PM_DEVICE=y

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=y

# Reduce application size
CONFIG_USE_SEGGER_RTT=n
CONFIG_MATTER_LOG_LEVEL_INF=y
CONFIG_CHIP_APP_LOG_LEVEL=3

# Enable Factory Data feature
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# Logs on the UART console (COM port of the J-Link), info level
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
